# Site setings
name: 'Jav Solo'
full_name: 'Javier Solorzano'
description: 'Software Engineer'
meta_description: 'Javier Solorzano, Software Engineer in Louisiana.'
logo:
# Author image is used in site sidebar and greetings in the home page hero text
author:
  image: 'authorimage.jpg'
  greetings: "Hi, I am Javier Solorzano! I build apps and games on Apple platforms."
favicon: 'assets/images/favicon.ico'
baseurl: 
production_url: https://javsolo.dev/
mailchimp_url: # Fill with mailchimp URL if you start a newsletter

# Social links
mastadon: 'javsolo'
twitter: 'jav-solo'
github: 'jav-solo'
email: contact@javsolo.dev
resume_link: 'assets/files/Resume.pdf'

# Navigation
navigation:
  - text: Blog
    url: /
  - text: About
    url: /about
  - text: Search
    url: /search

# Required Plugins
plugins_dir:
  - jekyll-paginate
  - jekyll-seo-tag
  - jekyll-sitemap

# Pagination
paginate: 5
paginate_path: /page:num/

# Permalinks
permalink: /:title

# Other
markdown: kramdown

# Sass
sass:
  sass_dir: _sass
  style: compressed
